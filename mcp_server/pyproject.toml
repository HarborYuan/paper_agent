[project]
name = "paper-agent-mcp"
version = "1.0.0"
description = "MCP server exposing a Paper Agent instance (semantic search, people-of-interest lookup, reports, scores) to Claude Code and other MCP clients"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
]

[project.scripts]
paper-agent-mcp = "paper_agent_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paper_agent_mcp"]
